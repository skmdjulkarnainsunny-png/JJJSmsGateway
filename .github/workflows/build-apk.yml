name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project layout
        run: |
          set -e
          echo "== root =="
          ls -la
          echo "== app =="
          ls -la app || true
          echo "== app/src/main =="
          ls -la app/src/main || true
          echo "== java pkg =="
          ls -la app/src/main/java/com/jjjbazar/smsgateway || true

          missing=0
          for f in \
            app \
            app/build.gradle \
            app/google-services.json \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/jjjbazar/smsgateway/MainActivity.java \
            build.gradle \
            settings.gradle
          do
            if [ ! -e "$f" ]; then
              echo "MISSING: $f"
              missing=1
            else
              echo "OK: $f"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Project layout incomplete. Upload the full JJJBazarSmsGateway folder (including app/src)."
            exit 1
          fi

          grep -q "buildscript" build.gradle || { echo "build.gradle missing buildscript block"; exit 1; }
          grep -q "saveScanInterval" app/src/main/java/com/jjjbazar/smsgateway/MainActivity.java || { echo "MainActivity missing saveScanInterval"; exit 1; }
          echo "Layout OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm cmdtools.zip
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create local.properties
        run: echo "sdk.dir=${{ env.ANDROID_HOME }}" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JJJ-SMS-Reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
